name: bantay
description: "Bantay - real-time community hazard mapping for the Philippines."
publish_to: 'none'

# version+build. The CI release workflow overrides the build number with the
# run number so every published artifact is uniquely versioned.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  geolocator: ^14.0.3
  image_picker: ^1.2.3
  http: ^1.6.0
  intl: ^0.20.3
  uuid: ^4.6.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
