name: CI

# Fast feedback on every push: static analysis, the full test suite, and a
# debug APK you can install on a phone straight from the run's artifacts -
# no tag, no signing keys, no local toolchain required.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: bantay-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  web:
    name: Build web
    runs-on: ubuntu-24.04
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # base-href makes the build work when served from a project subpath,
      # which is how GitHub Pages hosts it.
      - name: Build web
        run: flutter build web --release --base-href /Bantay/

      - name: Upload web build
        uses: actions/upload-artifact@v6
        with:
          name: bantay-web
          path: build/web
          retention-days: 30

  mobile:
    name: React Native (typecheck, lint, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      # Bundling is the real check that every import resolves and every
      # screen compiles - a typecheck alone will not catch a bad native
      # module path.
      - name: Bundle for Android
        run: npx expo export --platform android --output-dir dist

      - name: Upload bundle
        uses: actions/upload-artifact@v6
        with:
          name: bantay-rn-bundle
          path: mobile/dist
          retention-days: 14

  database:
    name: Database rules (Postgres)
    runs-on: ubuntu-24.04
    # Bantay and Bantay Admin share one database, and everything that decides
    # who may do what lives in it - so it is tested as a client would meet
    # it: as the `authenticated` role, with a JWT, against real Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bantay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bantay_test
    steps:
      - uses: actions/checkout@v5

      - name: Apply the Supabase stand-in, every migration, then the seed
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase_stub.sql
          for f in supabase/migrations/*.sql; do
            echo "applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql

      # Deploys can apply a migration more than once, so each must be safe to
      # re-run over itself.
      - name: Re-apply every migration
        run: |
          for f in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Check the rules
        run: python3 supabase/tests/rules_test.py
