name: CI

# Fast feedback on every push: static analysis, the full test suite, and a
# debug APK you can install on a phone straight from the run's artifacts -
# no tag, no signing keys, no local toolchain required.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: bantay-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  web:
    name: Build web
    runs-on: ubuntu-24.04
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # base-href makes the build work when served from a project subpath,
      # which is how GitHub Pages hosts it.
      - name: Build web
        run: flutter build web --release --base-href /Bantay/

      - name: Upload web build
        uses: actions/upload-artifact@v6
        with:
          name: bantay-web
          path: build/web
          retention-days: 30
