name: Release

# Produces the downloadable app.
#
# Push a version tag (for example `v1.0.0`) or run this workflow manually,
# and it publishes a GitHub Release carrying:
#   - a universal APK, which anyone can sideload onto an Android phone
#   - per-ABI APKs, which are roughly half the size
#   - an Android App Bundle (.aab) for uploading to Google Play
#   - a zipped web build you can host anywhere
#
# Signing: if the four ANDROID_* secrets are configured the release is signed
# with your upload key and is Play-Store ready. Without them the build still
# succeeds using the debug key, which is fine for sideloading and testing but
# cannot be published to Play. See docs/RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.0 (defaults to pubspec)'
        required: false
        type: string

env:
  FLUTTER_VERSION: 3.47.5

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # Lifted to job level so the signing step's `if` can read it; the
      # `secrets` context is not available in a step-level `if`.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Bantay ${VERSION} (build ${GITHUB_RUN_NUMBER})"

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

      # The keystore is held as a base64 secret so no binary is ever committed.
      # When the secrets are absent this step is skipped and the Gradle config
      # falls back to the debug key.
      - name: Configure signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "Release signing configured."

      - name: Build universal APK
        run: |
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${GITHUB_RUN_NUMBER}"
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
             "artifacts/bantay-${{ steps.version.outputs.version }}-universal.apk"

      - name: Build per-ABI APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${GITHUB_RUN_NUMBER}"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            [ -f "$src" ] && cp "$src" \
              "artifacts/bantay-${{ steps.version.outputs.version }}-${abi}.apk"
          done

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${GITHUB_RUN_NUMBER}"
          cp build/app/outputs/bundle/release/app-release.aab \
             "artifacts/bantay-${{ steps.version.outputs.version }}.aab"

      - name: Build web
        run: |
          flutter build web --release --base-href /Bantay/ \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${GITHUB_RUN_NUMBER}"
          (cd build/web && zip -qr "../../artifacts/bantay-${{ steps.version.outputs.version }}-web.zip" .)

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bantay-release-${{ steps.version.outputs.version }}
          path: artifacts/
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Bantay ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Bantay ${{ steps.version.outputs.version }}

            Real-time community hazard mapping for the Philippines.

            ### Install on Android
            Download **`bantay-${{ steps.version.outputs.version }}-universal.apk`**
            below and open it on your phone. You will need to allow installing
            from unknown sources the first time.

            If you want a smaller download and know your phone's chip, use the
            matching per-ABI APK instead - `arm64-v8a` covers almost every
            phone sold since 2017.

            ### Other artifacts
            - `.aab` - upload this to the Google Play Console
            - `-web.zip` - unzip and serve on any static host

            Built from `${{ github.sha }}`.
